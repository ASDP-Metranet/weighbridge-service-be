server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: weighbridge-service-be
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://157.10.253.209:3306/Core_ticketing?useSSL=false&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull&connectionTimeZone=Asia/Jakarta}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:By4T6zPkZsYJ1lMmz8kHGNaw}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# Weighbridge Hardware Configuration
weighbridge:
  scale:
    device-id: ${SCALE_DEVICE_ID:WB-MERAK-01}
    default-tolerance-percent: 5.0
    require-stable: ${SCALE_REQUIRE_STABLE:false}
    mock-stream-enabled: ${SCALE_MOCK_STREAM:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
